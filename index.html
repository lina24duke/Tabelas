<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criando Tabelas</title>
    <style>
         table { width:200px; margin: 0 auto border: 1px solid black; 
            border-collapse:collapse;text-align: center;caption-size:bottom;}  
         th, td {border: 1px solid black; padding: 3px 10px;    }
         th {background: #ddd;}

         
    </style>

</head>
<body>
    <h1>Como criar tabelas</h1>
    <table>
        <caption> Esta é uma tabela de exemplo</caption>
        <tr>
            <th>nome</th><th> idade</th>
        </tr>
        <tr>
            <td> joão</td><td>35</td>
        </tr>
        <tr>
            <td> Maria</td><td> 28</td>
        </tr>
        <tr>
            <td>Pedro</td><td>17</td>
        </tr>
    </table>
</body>
</html
